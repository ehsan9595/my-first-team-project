<script>
        pos = 0;
        right.onclick = function() {

            if ( pos > -500) {
                pos = pos - 100;
                gal.style.left = pos + "%"
            }
            else if( pos == -500)
            pos = 0;
            gal.style.left = pos + "%"

        }
        
        left.onclick = function() {

            if ( pos < 0) {
                pos = pos + 100;
                gal.style.left = pos + "%"
            }
           
           

        }



    </script>
